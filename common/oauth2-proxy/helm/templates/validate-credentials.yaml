{{- /*
Refuse to render while a placeholder credential is still in place. Without this
the chart installs successfully with a publicly known cookie secret, and anyone
who reads the repository can forge a session cookie.

Only checked when the workload is rendered. With oauth2Proxy.enabled=false no
Secret is created, so the credentials are unused.
*/ -}}
{{- if .Values.oauth2Proxy.enabled }}
{{- if eq (default "" .Values.credentials.clientSecret) "REPLACE_ME_CLIENT_SECRET" }}
{{- fail "credentials.clientSecret is still the placeholder; set it to the same value the dex chart uses" }}
{{- end }}
{{- $cookieSecret := default "" .Values.credentials.cookieSecret }}
{{- if eq $cookieSecret "REPLACE_ME_COOKIE_SECRET" }}
{{- fail "credentials.cookieSecret is still the placeholder; generate one with openssl rand -base64 32 | tr -- '+/' '-_'" }}
{{- end }}
{{- /*
Mirror oauth2-proxy's encryption.SecretBytes. It strips trailing padding, decodes
with unpadded URL-safe base64, and uses the decoded bytes only when they are a
valid AES key length; on any other outcome it uses the raw string. Sprig only
offers padded standard base64, so translate the alphabet and restore the padding,
and treat a value containing + or / as undecodable, which is what the URL-safe
decoder does.
*/ -}}
{{- $validLengths := list 16 24 32 }}
{{- $unpadded := regexReplaceAll "=+$" $cookieSecret "" }}
{{- $decodedLength := 0 }}
{{- if regexMatch "^[A-Za-z0-9_-]*$" $unpadded }}
{{- $remainder := mod (len $unpadded) 4 }}
{{- if ne $remainder 1 }}
{{- $standard := replace "_" "/" (replace "-" "+" $unpadded) }}
{{- $padded := printf "%s%s" $standard (repeat (int (mod (sub 4 $remainder) 4)) "=") }}
{{- $decodedLength = len (b64dec $padded) }}
{{- end }}
{{- end }}
{{- $rawLength := len $cookieSecret }}
{{- if not (or (has $decodedLength $validLengths) (has $rawLength $validLengths)) }}
{{- fail (printf "credentials.cookieSecret must be 16, 24 or 32 bytes, either raw or URL-safe base64; got %d raw bytes decoding to %d. Generate one with openssl rand -base64 32 | tr -- '+/' '-_'" $rawLength $decodedLength) }}
{{- end }}
{{- end }}
