provider = "oidc"
oidc_issuer_url = "http://dex.auth.svc.cluster.local:5556/dex"
# offline_access makes Dex issue a refresh token, which keeps the login alive
# past the ID token lifetime; see cookie_refresh below.
scope = "profile email groups openid offline_access"
email_domains = [ "*" ]

# Return a static HTTP 200 response when authentication succeeds.
# Use OAuth2-Proxy for external authorization to check each request, not forward it.
upstreams = [ "static://200" ]

# skip authentication for these paths
skip_auth_routes = [
  "^/dex/",
]

# Unauthenticated requests to paths matching these regular expressions receive
# a 401 Unauthorized response instead of a 302 redirect to the login page.
# This prevents background requests from being redirected to the login page
# and accumulating CSRF cookies.
api_routes = [
  # Generic
  # NOTE: included because most background requests contain these paths
  "/api/",
  "/apis/",

  # Kubeflow Pipelines
  # NOTE: included because KFP UI makes MANY background requests to these paths but because they are
  #       not `application/json` requests, oauth2-proxy will redirect them to the login page
  "^/ml_metadata",
]

# OIDC discovery must be skipped and the login URL provided directly
# to enable relative authentication redirects. Using OIDC discovery would set
# the redirect location to http://dex.auth.svc.cluster.local:5556 in the example
# installation. This address is usually not accessible from a web browser.
# If the Dex URL points to an address other than the in-cluster service,
# skipping discovery is optional.
skip_oidc_discovery = true
login_url = "/dex/auth"
redeem_url = "http://dex.auth.svc.cluster.local:5556/dex/token"
oidc_jwks_url = "http://dex.auth.svc.cluster.local:5556/dex/keys"

# if `false`, a sign-in page is displayed before starting the login flow
# prevents background requests starting their own login flow on token expiry,
# which can lead to many CSRF cookies, potentially exceeding the cookie limit
skip_provider_button = false

# style the sign-in page
provider_display_name = "Dex"
custom_sign_in_logo = "/custom-theme/kubeflow-logo.svg"
banner = "-"
footer = "-"

# oauth2-proxy sends "force" by default, which causes dex to always prompt for login
# https://github.com/dexidp/dex/pull/3086
prompt = "none"

# set Authorization Bearer response header. This is needed in order to
# forward the Authorization Bearer token to Istio and enable authorization
# based on JWT.
set_authorization_header = true

# set X-Auth-Request-User, X-Auth-Request-Groups, X-Auth-Request-Email and
# X-Auth-Request-Preferred-Username. This is optional for Kubeflow but you
# may have other services that use standard authentication headers.
set_xauthrequest = true

cookie_name = "oauth2_proxy_kubeflow"

# Dex issues ID tokens for one hour and refresh tokens for 168 hours
# (expiry in common/dex/base/config-map.yaml). Istio rejects an expired ID token,
# so the session is refreshed with the refresh token shortly before the hour ends.
# Dex refuses to refresh a login older than 168 hours, so the session ends at
# most one hour after that.
# cookie_refresh must stay below the ID token lifetime and cookie_expire must not
# exceed the refresh token lifetime, or a browser keeps a session cookie that no
# longer opens anything.
cookie_expire = "168h"
cookie_refresh = "59m"

code_challenge_method = "S256"

redirect_url = "/oauth2/callback"
relative_redirect_url = true
