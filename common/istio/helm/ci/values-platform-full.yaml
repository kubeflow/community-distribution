# CI values for the managed Kubeflow Istio platform slice.
profile: oauth2-proxy
crds:
  enabled: true
networkPolicies:
  enabled: true
install:
  enabled: true
clusterLocalGateway:
  enabled: true
  machineToMachineAuthentication:
    enabled: true
kubeflowIstioResources:
  enabled: true
namespaces:
  # The Kustomize side of this scenario builds istio-namespace/base, so the
  # comparison covers the Namespace here.
  create: true
