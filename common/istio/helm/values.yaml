# Default values for the Kubeflow Istio wrapper chart.
#
# The safe default renders only Istio CRDs. Install the chart first with the
# CRD-only values, then upgrade with a supported profile after the CRDs are
# available to the API server.

# -- Istio installation profile used when install.enabled=true. Supported values: base, oauth2-proxy, gke.
profile: oauth2-proxy

crds:
  # -- Render Istio CustomResourceDefinition resources.
  enabled: true

namespaces:
  # -- Render the istio-system Namespace. Leave this disabled for a Kubeflow
  # platform installation, where the kubeflow-namespaces chart owns every
  # platform namespace. A Kubernetes resource belongs to a single Helm release,
  # so two releases must not both render it. Enable it only when installing this
  # chart standalone, without the kubeflow-namespaces chart.
  create: false

networkPolicies:
  # -- Render Istio namespace NetworkPolicy resources.
  enabled: false

install:
  # -- Render Istio control-plane, gateway, CNI, and Istio custom resources.
  enabled: false

oauth2Proxy:
  # -- DNS-1123 service name for the oauth2-proxy extension provider.
  service: oauth2-proxy.oauth2-proxy.svc.cluster.local
  # -- oauth2-proxy extension provider service port.
  port: 80

clusterLocalGateway:
  # -- Render the Kubeflow cluster-local gateway resources.
  enabled: false
  machineToMachineAuthentication:
    # -- Require valid JWT principals on the cluster-local gateway, rendering
    # the cluster-local-gateway/overlays/m2m-auth payload instead of the base
    # payload. The managed platform installation enables this.
    enabled: false

kubeflowIstioResources:
  # -- Render Kubeflow-specific Istio gateway and RBAC resources.
  enabled: false
