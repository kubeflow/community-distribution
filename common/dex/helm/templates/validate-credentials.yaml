{{- /*
Refuse to render while a placeholder credential is still in place. Without this
the chart installs successfully with a publicly known OIDC client secret and a
password hash that no password matches.

Only checked when the workload is rendered. With dex.enabled=false no Secret is
created, so the credentials are unused.
*/ -}}
{{- if .Values.dex.enabled }}
{{- if eq (default "" .Values.oidcClient.secret) "REPLACE_ME_OIDC_CLIENT_SECRET" }}
{{- fail "oidcClient.secret is still the placeholder; set it to the same value the oauth2-proxy chart uses" }}
{{- end }}
{{- $hash := default "" .Values.staticPassword.hash }}
{{- /*
Both hash checks apply only while the password database is enabled. With
config.enablePasswordDB=false the hash is unused, so a placeholder must not
block the external-connector configuration.
*/ -}}
{{- if and .Values.config.enablePasswordDB (eq $hash "REPLACE_ME_STATIC_PASSWORD_HASH") }}
{{- fail "staticPassword.hash is still the placeholder; set it to a bcrypt hash, for example htpasswd -bnBC 12 \"\" 'your-password' | tr -d ':\\n'" }}
{{- end }}
{{- /*
A complete bcrypt hash: version, a cost Go's bcrypt accepts (4 to 31), then 22
characters of salt and 31 of digest in bcrypt's alphabet. A prefix alone is not
enough, because a truncated hash matches no password and the account silently
cannot log in.
*/ -}}
{{- if and .Values.config.enablePasswordDB (not (regexMatch "^\\$2[aby]\\$(0[4-9]|[12][0-9]|3[01])\\$[./A-Za-z0-9]{53}$" $hash)) }}
{{- fail "staticPassword.hash is not a complete bcrypt hash, so no password will ever match it; generate one with htpasswd -bnBC 12 \"\" 'your-password' | tr -d ':\\n'" }}
{{- end }}
{{- end }}
