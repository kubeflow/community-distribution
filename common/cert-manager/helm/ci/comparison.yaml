# Declares how this chart is compared against its Kustomize baseline.
# The harness discovers this file; no shared list needs editing.
component: cert-manager
releaseName: cert-manager
namespace: cert-manager
includeCustomResourceDefinitions: true
defaultScenario: base
dependencyRepositories:
  jetstack: https://charts.jetstack.io
ignoredLabels:
- keys: [app.kubernetes.io/managed-by]
  podTemplates: true
  reason: >
    The upstream chart labels every resource, including the Deployments' pod
    templates, app.kubernetes.io/managed-by: Helm; the static Kustomize
    baseline carries no such label.
knownDifferences:
- skip: Namespace/cert-manager
  reason: >
    The Kustomize base creates the cert-manager namespace; the chart is
    installed into an existing namespace and renders none.
retainedCustomResourceDefinitions:
  reason: >
    Upstream cert-manager annotates its CustomResourceDefinitions with
    helm.sh/resource-policy: keep, so helm uninstall leaves them and every
    certificate behind.
  names:
  - certificaterequests.cert-manager.io
  - certificates.cert-manager.io
  - challenges.acme.cert-manager.io
  - clusterissuers.cert-manager.io
  - issuers.cert-manager.io
  - orders.acme.cert-manager.io
scenarios:
  base:
    kustomize:
    - common/cert-manager/base
    values: ci/values-base.yaml
  existing-cert-manager:
    kustomize:
    - common/cert-manager/overlays/kubeflow
    values: ci/values-existing-cert-manager.yaml
  kubeflow:
    kustomize:
    - common/cert-manager/base
    - common/cert-manager/overlays/kubeflow
    values: ci/values-kubeflow.yaml
