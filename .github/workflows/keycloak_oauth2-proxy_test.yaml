name: Test Keycloak and OAuth2 Proxy without Dex
on:
  push:
    branches:
    - master
  pull_request:
    paths:
    - tests/install_KinD_create_KinD_cluster_install_kustomize.sh
    - .github/workflows/keycloak_oauth2-proxy_test.yaml
    - common/cert-manager/**
    - common/oauth2-proxy/**
    - common/istio*/**
    - tests/istio*
    - tests/keycloak/**
    - tests/keycloak_install.sh
    - tests/keycloak_login_test.py
    - tests/keycloak_oauth2-proxy_install.sh
    - tests/cert_manager_install.sh
    - tests/dashboard_install.sh
    - tests/multi_tenancy_install.sh
    - tests/katib_install.sh
    - tests/workspaces_install.sh
    - tests/workspaces_test.sh
    - applications/workspaces/**

permissions:
  contents: read
  actions: read

jobs:
  keycloak_oauth2-proxy_test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      KF_PROFILE: kubeflow-user-example-com
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install KinD, Create KinD cluster and Install kustomize
      run: ./tests/install_KinD_create_KinD_cluster_install_kustomize.sh

    - name: Create kubeflow namespace
      run: kustomize build common/kubeflow-namespace/base | kubectl apply -f -

    - name: Install cert-manager
      run: ./tests/cert_manager_install.sh

    - name: Install Istio CNI
      run: ./tests/istio-cni_install.sh

    - name: Install Keycloak
      run: ./tests/keycloak_install.sh

    - name: Install oauth2-proxy connected directly to Keycloak
      run: ./tests/keycloak_oauth2-proxy_install.sh

    - name: Install kubeflow-istio-resources
      run: kustomize build common/istio/kubeflow-istio-resources/base | kubectl apply -f -

    - name: Install Kubeflow multi-tenancy roles
      run: ./tests/multi_tenancy_install.sh

    - name: Install Dashboard
      run: ./tests/dashboard_install.sh

    - name: Install Knative Serving
      run: ./tests/knative_serving_install.sh

    - name: Install KServe
      run: ./tests/kserve_install.sh

    - name: Install Pipelines
      run: ./tests/pipelines_install.sh

    - name: Create the Kubeflow Profile
      run: ./tests/kubeflow_profile_install.sh

    - name: Install Workspaces
      run: ./tests/workspaces_install.sh

    - name: Install Katib
      run: ./tests/katib_install.sh

    - name: Apply Pod Security Standards restricted levels
      run: ./tests/PSS_enable.sh

    - name: Port forward the istio-ingress gateway
      run: ./tests/port_forward_gateway.sh

    - name: Test Keycloak login
      run: |
        pip3 install -q requests
        python3 tests/keycloak_login_test.py

    - name: Test Workspaces service account access
      run: ./tests/workspaces_test.sh

    - name: Collect Logs on Failure
      if: failure()
      timeout-minutes: 5
      run: |
        mkdir -p logs
        kubectl get all --all-namespaces > logs/resources.txt
        kubectl get events --all-namespaces --sort-by=.metadata.creationTimestamp > logs/events.txt
        for namespace in kubeflow kubeflow-workspaces istio-system cert-manager keycloak oauth2-proxy kserve knative-serving kubeflow-user-example-com; do
            kubectl describe pods -n $namespace > logs/$namespace-pods.txt
            for pod in $(kubectl get pods -n $namespace -o jsonpath='{.items[*].metadata.name}'); do
                kubectl logs -n $namespace $pod --all-containers --tail=200 > logs/$namespace-$pod.txt 2>&1 || true
            done
        done

    - name: Upload Diagnostic Logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: keycloak-test-logs
        path: logs/
