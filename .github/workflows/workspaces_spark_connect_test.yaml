name: Test Spark Connect from Workspace
on:
  push:
    branches:
    - mster
  pull_request:
    paths:
    - tests/install_KinD_create_KinD_cluster_install_kustomize.sh
    - .github/workflows/workspaces_spark_connect_test.yaml
    - applications/spark/**
    - applications/workspaces/**
    - applications/dashboard/upstream/profile-controller/**
    - tests/spark*.sh
    - tests/workspaces_install.sh
    - tests/workspaces_spark_connect_test.sh
    - tests/spark_connect_from_workspace.py
    - tests/workspacekind.spark.test.yaml
    - tests/workspace.spark.test.kubeflow-user-example-com.yaml
    - tests/istio*
    - tests/multi_tenancy_install.sh
    - tests/profile_controller_install.sh
    - tests/oauth2-proxy_install.sh
    - tests/cert_manager_install.sh
    - common/cert-manager/**
    - common/oauth2-proxy/**
    - common/istio*/**
    - common/kubeflow-namespace/**
    - common/user-namespace/**
    - common/kubeflow-roles/**

permissions:
  contents: read
  actions: read

jobs:
  workspaces_spark_connect_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install KinD, Create KinD cluster and Install kustomize
      run: ./tests/install_KinD_create_KinD_cluster_install_kustomize.sh

    - name: Create kubeflow namespace
      run: kustomize build common/kubeflow-namespace/base | kubectl apply -f -

    - name: Install Istio
      run: ./tests/istio-cni_install.sh

    - name: Install oauth2-proxy
      run: ./tests/oauth2-proxy_install.sh

    - name: Install cert-manager
      run: ./tests/cert_manager_install.sh

    - name: Install Kubeflow Istio Resources
      run: kustomize build common/istio/kubeflow-istio-resources/base | kubectl apply -f -

    - name: Install Profile Controller
      run: ./tests/profile_controller_install.sh

    - name: Install KF Multi Tenancy
      run: ./tests/multi_tenancy_install.sh

    - name: Create KF Profile
      run: kustomize build common/user-namespace/base | kubectl apply -f -

    - name: Install Spark Operator
      run: |
        chmod u+x tests/*.sh
        ./tests/spark_install.sh

    - name: Install Kubeflow Workspaces
      run: ./tests/workspaces_install.sh

    - name: Run Spark Connect from Workspace Test
      run: ./tests/workspaces_spark_connect_test.sh

    - name: Collect Logs on Failure
      if: failure()
      # kubectl has no request timeout by default, so bound this step and
      # let the upload below still run if the API server stops responding.
      timeout-minutes: 5
      run: |
        mkdir -p logs
        kubectl get all --all-namespaces > logs/resources.txt
        kubectl get events --all-namespaces --sort-by=.metadata.creationTimestamp > logs/events.txt
        kubectl get workspace spark-test -n kubeflow-user-example-com -o yaml > logs/workspace-spark-test.yaml 2>&1 || true
        kubectl get workspacekind jupyterlab-spark -o yaml > logs/workspacekind-jupyterlab-spark.yaml 2>&1 || true
        kubectl get sparkconnect -n kubeflow-user-example-com -o yaml > logs/sparkconnect.yaml 2>&1 || true
        for namespace in kubeflow kubeflow-workspaces kubeflow-user-example-com istio-system cert-manager auth; do
            kubectl describe pods -n $namespace > logs/$namespace-pods.txt
            for pod in $(kubectl get pods -n $namespace -o jsonpath='{.items[*].metadata.name}'); do
                kubectl logs -n $namespace $pod --tail=100 > logs/$namespace-$pod.txt 2>&1 || true
            done
        done

    - name: Upload Diagnostic Logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: kubeflow-spark-connect-test-logs
        path: logs/
