name: Image Extracting and Security Scanning

on:
  workflow_dispatch:
  push:
    branches:
    - master
  pull_request:
    paths:
    - tests/kustomize_install.sh
    - .github/workflows/osv-scanner.yaml
    - tests/osv_scanner_scan.py
    - tests/osv_scanner_install.sh

permissions:
  contents: read
  actions: read

jobs:
  osv-scanner:
    if: ${{ github.repository == 'kubeflow/community-distribution' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Free runner disk space
      run: |
        df -h
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/share/swift
        sudo rm -rf /opt/hostedtoolcache/CodeQL || true
        sudo rm -rf /opt/hostedtoolcache/Java_* || true
        sudo rm -rf /opt/hostedtoolcache/Ruby || true
        sudo rm -rf /opt/hostedtoolcache/PyPy || true
        sudo rm -rf /opt/hostedtoolcache/boost || true
        sudo apt-get autoclean
        docker system prune -af --volumes
        docker image prune -af
        df -h

    # Install kustomize
    - name: Install kustomize
      run: |
        bash tests/kustomize_install.sh

    # Install osv-scanner
    - name: Install osv-scanner
      run: |
        bash tests/osv_scanner_install.sh

    # Install Python
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    # Install prettytable package
    - name: Install prettytable
      run: |
        pip install prettytable

    - name: Run image extracting and security scanning script
      run: |
        cd tests
        python3 osv_scanner_scan.py

    - name: Upload osv-scanner scanned_results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: osv_scanner_scanned_results
        path: image_lists/
