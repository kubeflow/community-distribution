name: Test Dex and OAuth2 Proxy
on:
  pull_request:
    paths:
    - tests/install_KinD_create_KinD_cluster_install_kustomize.sh
    - .github/workflows/dex_oauth2-proxy_test.yaml
    - common/cert-manager/**
    - common/oauth2-proxy/**
    - common/istio*/**
    - experimental/security/PSS/*
    - common/dex/base/**
    - common/dex/overlays/oauth2-proxy/**
    - tests/istio*
    - tests/dex_login_test.py
    - tests/dex_session_refresh_test.py
    - tests/cert_manager_install.sh
    - tests/dashboard_install.sh
    - tests/multi_tenancy_install.sh

permissions:
  contents: read
  actions: read

jobs:
  dex_oauth2-proxy_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install KinD, Create KinD cluster and Install kustomize
      run: ./tests/install_KinD_create_KinD_cluster_install_kustomize.sh

    - name: Create kubeflow namespace
      run: kustomize build common/kubeflow-namespace/base | kubectl apply -f -

    - name: Install cert-manager
      run: ./tests/cert_manager_install.sh

    - name: Install Istio CNI
      run: ./tests/istio-cni_install.sh

    - name: Install oauth2-proxy
      run: ./tests/oauth2-proxy_install.sh

    - name: Install kubeflow-istio-resources
      run: kustomize build common/istio/kubeflow-istio-resources/base | kubectl apply -f -

    - name: Install KF Multi Tenancy
      run: ./tests/multi_tenancy_install.sh

    - name: Install dex
      run: ./tests/dex_install.sh

    - name: Install Dashboard
      run: ./tests/dashboard_install.sh

    - name: Create KF Profile
      run: ./tests/kubeflow_profile_install.sh

    - name: Apply Pod Security Standards restricted levels
      run: ./tests/PSS_enable.sh

    - name: Port forward the istio-ingress gateway
      run: ./tests/port_forward_gateway.sh

    - name: Test dex login
      run: |
        # Install Python requirements
        pip3 install -q requests

        # Run the Dex login test
        python3 tests/dex_login_test.py

        echo "Dex login test completed successfully."

    - name: Shorten the token lifetimes for the session refresh test
      run: |
        # Dex and OAuth2 Proxy read their configuration at start. One minute ID
        # tokens and a 30 second cookie refresh let the test observe a refresh
        # within its run time. The environment variable takes precedence over
        # cookie_refresh in oauth2_proxy.cfg.
        # absoluteLifetime is shortened as well, so the test reaches the deadline
        # after which Dex refuses to refresh the login.
        dex_configuration=$(kubectl -n auth get configmap dex -o jsonpath='{.data.config\.yaml}' \
          | sed 's/idTokens: "1h"/idTokens: "1m"/; s/absoluteLifetime: "168h"/absoluteLifetime: "4m"/')
        grep -q 'idTokens: "1m"' <<< "$dex_configuration"
        grep -q 'absoluteLifetime: "4m"' <<< "$dex_configuration"
        kubectl -n auth patch configmap dex --type merge \
          --patch "$(jq -n --arg configuration "$dex_configuration" '{data: {"config.yaml": $configuration}}')"
        kubectl -n auth rollout restart deployment/dex
        kubectl -n auth rollout status deployment/dex --timeout=180s
        kubectl -n oauth2-proxy set env deployment/oauth2-proxy OAUTH2_PROXY_COOKIE_REFRESH=30s
        kubectl -n oauth2-proxy rollout status deployment/oauth2-proxy --timeout=180s

    - name: Test session refresh
      run: python3 tests/dex_session_refresh_test.py

    - name: Collect Logs on Failure
      if: failure()
      # kubectl has no request timeout by default, so bound this step and
      # let the upload below still run if the API server stops responding.
      timeout-minutes: 5
      run: |
        mkdir -p logs
        kubectl get all --all-namespaces > logs/resources.txt
        kubectl get events --all-namespaces --sort-by=.metadata.creationTimestamp > logs/events.txt
        for namespace in kubeflow istio-system cert-manager auth oauth2-proxy kubeflow-user-example-com; do
            kubectl describe pods -n $namespace > logs/$namespace-pods.txt
            for pod in $(kubectl get pods -n $namespace -o jsonpath='{.items[*].metadata.name}'); do
                kubectl logs -n $namespace $pod --tail=100 > logs/$namespace-$pod.txt 2>&1 || true
            done
        done

    - name: Upload Diagnostic Logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: kubeflow-test-logs
        path: logs/
