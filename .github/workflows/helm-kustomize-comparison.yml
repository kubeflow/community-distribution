name: Helm vs Kustomize Comparison

on:
  pull_request:
    paths:
    - experimental/helm/charts/**
    - applications/hub/**
    - applications/kserve/kserve-ui/**
    - common/cert-manager/**
    - common/kubeflow-namespace/**
    - common/kubeflow-roles/**
    - scripts/synchronize-cert-manager-manifests.sh
    - scripts/synchronize-hub-manifests.sh
    - common/dex/**
    - scripts/synchronize-dex-manifests.sh
    - common/oauth2-proxy/**
    - scripts/synchronize-oauth2-proxy-manifests.sh
    - common/istio/**
    - scripts/synchronize-istio-manifests.sh
    - tests/kustomize_install.sh
    - tests/helm_kustomize_compare.py
    - tests/test_helm_kustomize_compare.py
    - tests/helm_kustomize_compare.sh
    - tests/helm_kustomize_compare_all.sh
    - tests/test_dex_helm_rollout_checksums.py
    - tests/test_istio_helm_chart.py
    - .github/workflows/helm-kustomize-comparison.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-dex-unit-tests:
    runs-on: ubuntu-latest
    name: Test Dex Helm behavior
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Install Python dependencies
      run: python -m pip install pyyaml
    - name: Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      with:
        version: v4.2.2
    - name: Install Kustomize
      run: ./tests/kustomize_install.sh
    - name: Test Helm comparison normalization
      run: python tests/test_helm_kustomize_compare.py
    - name: Test Dex Helm behavior
      run: python tests/test_dex_helm_rollout_checksums.py
    - name: Compare Dex Helm and Kustomize manifests
      env:
        VERBOSE: "true"
      run: ./tests/helm_kustomize_compare_all.sh dex

  validate-comparison-unit-tests:
    runs-on: ubuntu-latest
    name: Test comparison normalization
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Install Python dependencies
      run: python -m pip install pyyaml
    - name: Run comparison unit tests
      run: python -m unittest tests/test_helm_kustomize_compare.py

  validate-istio-unit-tests:
    runs-on: ubuntu-latest
    name: Test Istio Helm behavior
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Install Python dependencies
      run: python -m pip install pyyaml
    - name: Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      with:
        version: v4.2.2
    - name: Install Kustomize
      run: |
        ./tests/kustomize_install.sh
        echo "/tmp/usr/local/bin" >> "$GITHUB_PATH"
    - name: Test Istio Helm behavior
      run: python tests/test_istio_helm_chart.py
    - name: Compare Istio Helm and Kustomize manifests
      env:
        VERBOSE: "true"
      run: ./tests/helm_kustomize_compare_all.sh istio

  validate-helm-kustomize-equivalence:
    continue-on-error: true
    runs-on: ubuntu-latest
    name: Compare All Scenarios
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml
    - name: Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      with:
        version: v4.2.2
    - name: Install Kustomize
      run: ./tests/kustomize_install.sh
    - name: Run all scenarios comparison
      env:
        VERBOSE: "true"
      run: |
        ./tests/helm_kustomize_compare_all.sh
