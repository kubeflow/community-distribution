name: Test Kubeflow Pipelines Helm Installation

on:
  push:
    branches:
    - master
    paths:
    - applications/pipeline/helm/**
    - applications/pipeline/overlays/**
    - applications/pipeline/upstream/**
    - common/cert-manager/**
    - common/kubeflow-namespace/**
    - common/kubeflow-roles/**
    - common/istio/**
    - common/oauth2-proxy/**
    - common/user-namespace/**
    - applications/dashboard/upstream/profile-controller/**
    - scripts/generate-pipelines-helm-manifests.py
    - scripts/synchronize-pipelines-manifests.sh
    - tests/pipelines_helm_install.sh
    - tests/install_KinD_create_KinD_cluster_install_kustomize.sh
    - tests/istio-cni_install.sh
    - tests/oauth2-proxy_install.sh
    - tests/profile_controller_install.sh
    - tests/kubeflow_profile_install.sh
    - tests/port_forward_gateway.sh
    - tests/pipeline_v2_test.py
    - .github/workflows/helm-pipelines-test.yaml
  pull_request:
    paths:
    - applications/pipeline/helm/**
    - applications/pipeline/overlays/**
    - applications/pipeline/upstream/**
    - common/cert-manager/**
    - common/kubeflow-namespace/**
    - common/kubeflow-roles/**
    - common/istio/**
    - common/oauth2-proxy/**
    - common/user-namespace/**
    - applications/dashboard/upstream/profile-controller/**
    - scripts/generate-pipelines-helm-manifests.py
    - scripts/synchronize-pipelines-manifests.sh
    - tests/pipelines_helm_install.sh
    - tests/install_KinD_create_KinD_cluster_install_kustomize.sh
    - tests/istio-cni_install.sh
    - tests/oauth2-proxy_install.sh
    - tests/profile_controller_install.sh
    - tests/kubeflow_profile_install.sh
    - tests/port_forward_gateway.sh
    - tests/pipeline_v2_test.py
    - .github/workflows/helm-pipelines-test.yaml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  kubeflow_pipelines_helm_installation:
    name: Install ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KF_PROFILE: kubeflow-user-example-com
    strategy:
      fail-fast: false
      matrix:
        scenario:
        - platform-database
        - platform-k8s-native

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install KinD, create the cluster, and install Kustomize
      run: |
        ./tests/install_KinD_create_KinD_cluster_install_kustomize.sh
        echo "/tmp/usr/local/bin" >> "$GITHUB_PATH"

    - name: Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      with:
        version: v4.2.2

    - name: Install Kubeflow foundation charts
      run: |
        helm install kubeflow-namespaces ./common/kubeflow-namespace/helm \
          --namespace default \
          --wait \
          --timeout 5m
        helm install kubeflow-platform ./common/kubeflow-roles/helm \
          --namespace kubeflow-system \
          --wait \
          --timeout 5m

    - name: Install cert-manager with Helm
      run: |
        helm repo add jetstack https://charts.jetstack.io || helm repo update jetstack
        helm dependency build ./common/cert-manager/helm
        helm install cert-manager ./common/cert-manager/helm \
          --namespace cert-manager \
          --values ./common/cert-manager/helm/ci/values-base.yaml \
          --wait \
          --timeout 5m
        helm upgrade cert-manager ./common/cert-manager/helm \
          --namespace cert-manager \
          --values ./common/cert-manager/helm/ci/values-kubeflow.yaml \
          --wait \
          --timeout 5m

    - name: Install Istio
      run: ./tests/istio-cni_install.sh

    - name: Install OAuth2-Proxy
      run: ./tests/oauth2-proxy_install.sh

    - name: Install Kubeflow Istio resources
      run: kustomize build common/istio/kubeflow-istio-resources/base | kubectl apply -f -

    - name: Install Profile Controller
      run: ./tests/profile_controller_install.sh

    - name: Install Kubeflow Pipelines with Helm
      run: ./tests/pipelines_helm_install.sh "${{ matrix.scenario }}"

    - name: Create Kubeflow Profile
      run: ./tests/kubeflow_profile_install.sh

    - name: Port-forward the Istio ingress gateway
      run: ./tests/port_forward_gateway.sh

    - name: Run a stored V2 pipeline
      run: |
        pip3 install -U "kfp==2.18.0" "kfp-kubernetes==2.18.0"
        TOKEN="$(kubectl -n "$KF_PROFILE" create token default-editor)"
        python3 tests/pipeline_v2_test.py run_uploaded_pipeline "$TOKEN" "$KF_PROFILE"

    - name: Verify Kubernetes-native pipeline storage
      if: matrix.scenario == 'platform-k8s-native'
      run: |
        for resource in pipelines.pipelines.kubeflow.org pipelineversions.pipelines.kubeflow.org; do
          kubectl -n "$KF_PROFILE" get "$resource" -o json | jq -e '.items | length > 0'
        done

    - name: Reject unauthorized pipeline access
      run: |
        kubectl create namespace test-unauthorized
        kubectl -n test-unauthorized create serviceaccount test-unauthorized
        TOKEN="$(kubectl -n test-unauthorized create token test-unauthorized)"
        python3 tests/pipeline_v2_test.py test_unauthorized_access "$TOKEN" "$KF_PROFILE"

    - name: Collect failure diagnostics
      if: failure()
      continue-on-error: true
      run: |
        set +e
        helm list --all-namespaces
        kubectl get pods,services,deployments,statefulsets -A -o wide
        kubectl get customresourcedefinitions
        kubectl get events -A --sort-by=.lastTimestamp
