name: Test Spark Application from Pipeline
on:
  pull_request:
    paths:
    - tests/install_KinD_create_KinD_cluster_install_kustomize.sh
    - .github/workflows/spark_pipeline_test.yaml
    - applications/spark/**
    - applications/pipeline/**
    - common/user-namespace/**
    - tests/kubeflow_profile_install.sh
    - tests/spark_install.sh
    - tests/spark_pipeline_test.py
    - tests/pipelines_install.sh
    - tests/istio*
    - tests/multi_tenancy_install.sh
    - tests/profile_controller_install.sh
    - applications/dashboard/upstream/profile-controller/**
    - tests/oauth2-proxy_install.sh
    - common/cert-manager/**
    - common/oauth2-proxy/**
    - common/istio*/**
    - common/kubeflow-roles/**

permissions:
  contents: read
  actions: read

env:
  KF_PROFILE: kubeflow-user-example-com

jobs:
  spark_pipeline_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install KinD, Create KinD cluster and Install kustomize
      run: ./tests/install_KinD_create_KinD_cluster_install_kustomize.sh

    - name: Create kubeflow namespace
      run: kustomize build common/kubeflow-namespace/base | kubectl apply -f -

    - name: Install Istio
      run: ./tests/istio-cni_install.sh

    - name: Install oauth2-proxy
      run: ./tests/oauth2-proxy_install.sh

    - name: Install cert-manager
      run: ./tests/cert_manager_install.sh

    - name: Install Kubeflow Istio Resources
      run: kustomize build common/istio/kubeflow-istio-resources/base | kubectl apply -f -

    - name: Install Profile Controller
      run: ./tests/profile_controller_install.sh

    - name: Install Multi-Tenancy
      run: ./tests/multi_tenancy_install.sh

    - name: Install KF Pipelines
      run: ./tests/pipelines_install.sh

    - name: Install Spark Operator
      run: ./tests/spark_install.sh

    - name: Create KF Profile
      run: ./tests/kubeflow_profile_install.sh

    - name: Wait for All Pods to be Ready
      run: kubectl wait --for=condition=Ready pods --all --all-namespaces --timeout 60s --field-selector=status.phase!=Succeeded

    - name: Port forward
      run: ./tests/port_forward_gateway.sh

    - name: Run Spark Pi from a Pipeline and read the driver logs
      run: |
        pip3 install "kfp==2.18.0" "kfp-kubernetes==2.18.0"
        TOKEN="$(kubectl -n "${KF_PROFILE}" create token default-editor)"
        python3 tests/spark_pipeline_test.py "${TOKEN}" "${KF_PROFILE}"

    - name: Delete the SparkApplication
      run: kubectl -n "${KF_PROFILE}" delete sparkapplication spark-pi-pipeline --ignore-not-found

    - name: Apply Pod Security Standards restricted levels
      run: ./tests/PSS_enable.sh

    - name: Collect Logs on Failure
      if: failure()
      # kubectl has no request timeout by default, so bound this step and
      # let the upload below still run if the API server stops responding.
      timeout-minutes: 5
      run: |
        mkdir -p logs
        kubectl get all --all-namespaces > logs/resources.txt
        kubectl get events --all-namespaces --sort-by=.metadata.creationTimestamp > logs/events.txt
        kubectl get sparkapplication spark-pi-pipeline -n "${KF_PROFILE}" -o yaml > logs/sparkapplication.yaml 2>&1 || true
        kubectl get workflows -n "${KF_PROFILE}" -o yaml > logs/workflows.yaml 2>&1 || true
        for namespace in kubeflow "${KF_PROFILE}" istio-system cert-manager auth; do
            kubectl describe pods -n $namespace > logs/$namespace-pods.txt
            for pod in $(kubectl get pods -n $namespace -o jsonpath='{.items[*].metadata.name}'); do
                kubectl logs -n $namespace $pod --all-containers --tail=200 > logs/$namespace-$pod.txt 2>&1 || true
            done
        done

    - name: Upload Diagnostic Logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: kubeflow-test-logs
        path: logs/
