name: Check if the upstream synchronization is idempotent
on:
  pull_request:

permissions:
  contents: read

jobs:
  upstream_synchronization_idempotence_test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup python 3.13
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"

    - name: Install Python dependencies
      # PyYAML is required because the synchronization scripts generate Helm
      # payloads. They no longer compare parity; the per-component comparison
      # jobs in helm-kustomize-comparison.yml are the authority on that.
      run: python -m pip install pyyaml ruamel.yaml==0.19.1

    - name: Test Helm synchronization library
      run: python -m unittest tests/helm_synchronization_library_test.py

    - name: Install Kustomize
      working-directory: /tmp
      run: |
        "$GITHUB_WORKSPACE/tests/kustomize_install.sh"
        echo "/tmp/usr/local/bin" >> "$GITHUB_PATH"

    - name: Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      with:
        version: v4.2.2

    - name: Test Helm synchronization tooling
      run: |
        python -m unittest tests/helm_manifest_generator_test.py
        python -m unittest tests/dashboard_helm_manifest_generator_test.py

    - name: Run upstream synchronization scripts for changed files
      run: |
        mapfile -t changed_files < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
        tests/resynchronize-upstream-changes.py "${changed_files[@]}"

    - name: Check that the upstream synchronization is idempotent
      run: |
        # Stage every path so the line-ending normalization mandated by
        # .gitattributes (text=auto eol=lf) is applied before comparison.
        # Some upstream repositories ship files with CRLF line terminators;
        # once normalized to LF they are byte-identical to the committed
        # blobs, so comparing the staged tree against HEAD detects only
        # genuine content, addition or removal changes and ignores the
        # renormalization that "git status --porcelain" would flag falsely.
        git add --all
        if git diff --cached --quiet; then
            echo "No changes detected, upstream synchronization is idempotent"
        else
            echo "Upstream synchronization introduced changes, synchronization is not idempotent:"
            git diff --cached
            exit 1
        fi
