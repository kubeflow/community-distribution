# Based on common/oauth2-proxy/base/oauth2_proxy.cfg, without the Dex-specific
# settings: OpenID Connect discovery is enabled, `prompt = "none"` is removed
# because Keycloak answers it with `login_required` when no session exists yet,
# and the redirect address is absolute.
provider = "oidc"
oidc_issuer_url = "http://keycloak.keycloak.svc.cluster.local:8081/realms/kubeflow"
scope = "openid profile email"
email_domains = [ "*" ]

upstreams = [ "static://200" ]

api_routes = [
  "/api/",
  "/apis/",
  "^/ml_metadata",
]

skip_provider_button = false
provider_display_name = "Keycloak"
custom_sign_in_logo = "/custom-theme/kubeflow-logo.svg"
banner = "-"
footer = "-"

set_authorization_header = true
set_xauthrequest = true

cookie_name = "oauth2_proxy_kubeflow"
# The test realm issues tokens that expire after 60 seconds (accessTokenLifespan in
# tests/keycloak/realm.json), so the session is refreshed after 30 seconds. With the
# Keycloak default of 5 minutes, use a value below 5 minutes, for example "4m".
cookie_refresh = "30s"
cookie_expire = "10h"

code_challenge_method = "S256"

# Keycloak only accepts an absolute redirect address. The relative redirect of the
# Dex configuration (relative_redirect_url = true) is rejected with HTTP status 400.
redirect_url = "http://localhost:8080/oauth2/callback"
relative_redirect_url = false
