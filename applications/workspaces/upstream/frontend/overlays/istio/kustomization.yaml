apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kubeflow-workspaces

resources:
- ../../base

components:
- ../../components/istio
- ../../components/common

replacements:
- source:
    fieldPath: metadata.name
    kind: Service
    name: workspaces-frontend
    version: v1
  targets:
  - fieldPaths:
    - spec.http.0.route.0.destination.host
    options:
      delimiter: .
    select:
      group: networking.istio.io
      kind: VirtualService
      name: workspaces-frontend
      version: v1beta1
  - fieldPaths:
    - spec.host
    options:
      delimiter: .
    select:
      group: networking.istio.io
      kind: DestinationRule
      name: workspaces-frontend
      version: v1beta1
- source:
    fieldPath: metadata.namespace
    kind: Service
    name: workspaces-frontend
    version: v1
  targets:
  - fieldPaths:
    - spec.http.0.route.0.destination.host
    options:
      delimiter: .
      index: 1
    select:
      group: networking.istio.io
      kind: VirtualService
      name: workspaces-frontend
      version: v1beta1
  - fieldPaths:
    - spec.host
    options:
      delimiter: .
      index: 1
    select:
      group: networking.istio.io
      kind: DestinationRule
      name: workspaces-frontend
      version: v1beta1
- source:
    fieldPath: spec.ports.[name=http-ui].port
    kind: Service
    name: workspaces-frontend
    version: v1
  targets:
  - fieldPaths:
    - spec.http.0.route.0.destination.port.number
    select:
      group: networking.istio.io
      kind: VirtualService
      name: workspaces-frontend
      version: v1beta1
