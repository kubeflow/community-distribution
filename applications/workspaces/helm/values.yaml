# Default values for the Kubeflow Workspaces chart.
#
# Workspaces (Notebooks v2) is still pre-GA. Do not deploy it to a production
# cluster.
#
# The chart vendors the Kustomize Istio overlay with two controlled transforms:
# both definitions receive helm.sh/resource-policy: keep, and the three
# aggregated ClusterRoles omit their empty rules field, which the Kubernetes
# aggregation controller owns. Values that the Kustomize baseline declares, such
# as container images, are not exposed; that is a separate change.

# -- Rendered Kustomize parity scenario.
# Supported value: istio
scenario: istio

customResourceDefinitions:
  # -- Render the Workspace and WorkspaceKind custom resource definitions.
  # They are rendered as ordinary templates rather than from crds/, because Helm
  # never upgrades or deletes anything in crds/, and they carry
  # helm.sh/resource-policy: keep so uninstalling the release cannot delete
  # existing Workspaces and WorkspaceKinds. Helm's --skip-crds does not apply to
  # templates; set this to false instead when an administrator or another
  # release already owns them.
  enabled: true
