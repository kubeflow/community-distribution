{{- $scenario := default "" .Values.scenario -}}
{{- $validScenarios := list "platform" -}}
{{- if not (has $scenario $validScenarios) -}}
{{- fail (printf "invalid scenario %q; supported values: %s" $scenario (join ", " $validScenarios)) -}}
{{- end -}}
{{- if and (not .Values.customResourceDefinitions.enabled) (not .Values.resources.enabled) -}}
{{- fail "at least one of customResourceDefinitions.enabled or resources.enabled must be true" -}}
{{- end -}}
