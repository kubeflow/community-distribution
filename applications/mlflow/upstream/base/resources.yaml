# Source: mlflow/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: kubeflow
  labels:
    helm.sh/chart: mlflow-0.1.0
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/instance: mlflow
    app.kubernetes.io/version: "3.13.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
      app.kubernetes.io/instance: mlflow
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/instance: mlflow
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: mlflow
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: mlflow-storage
          persistentVolumeClaim:
            claimName: mlflow
        
      

      containers:
        - name: mlflow
          image: ghcr.io/kubeflow/mlflow-integration:v1.6.0
          imagePullPolicy: IfNotPresent
          command:
            - mlflow
          args:
            - server
            - --serve-artifacts
            - --artifacts-destination=file:///mlflow/artifacts
            - --app-name=kubernetes-auth
            - --enable-workspaces
            - --workspace-store-uri=kubernetes://
            - --host=0.0.0.0
            - --port=5000
            - --workers=1
            - --allowed-hosts
            - "localhost,127.0.0.1,[::1],0.0.0.0,localhost:*,127.0.0.1:*,[[]::1]:*,0.0.0.0:*,192.168.*,10.*,172.16.*,172.17.*,172.18.*,172.19.*,172.20.*,172.21.*,172.22.*,172.23.*,172.24.*,172.25.*,172.26.*,172.27.*,172.28.*,172.29.*,172.30.*,172.31.*,fc00:*,fd00:*,mlflow,mlflow:*,mlflow.kubeflow,mlflow.kubeflow:*,mlflow.kubeflow.svc,mlflow.kubeflow.svc:*,mlflow.kubeflow.svc.cluster.local,mlflow.kubeflow.svc.cluster.local:*"
            - --static-prefix=/mlflow
          env:
            - name: MLFLOW_DISABLE_TELEMETRY
              value: "true"
            - name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
              value: "false"
            - name: MLFLOW_BACKEND_STORE_URI
              value: "sqlite:////mlflow/mlflow.db"
            - name: MLFLOW_K8S_AUTH_AUTHORIZATION_MODE
              value: "subject_access_review"
            - name: MLFLOW_K8S_WORKSPACE_LABEL_SELECTOR
              value: "app.kubernetes.io/part-of=kubeflow-profile"
            - name: MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE
              value: "false"
            - name: MLFLOW_K8S_AUTH_REMOTE_USER_HEADER
              value: "x-auth-request-email"
            - name: MLFLOW_K8S_AUTH_REMOTE_GROUPS_HEADER
              value: "x-auth-request-groups"
          ports:
            - name: http
              containerPort: 5000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: mlflow-storage
              mountPath: /mlflow
          livenessProbe:
            httpGet:
              path: /mlflow/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /mlflow/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            timeoutSeconds: 1
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
