          ; do\n  i=$((i+1))\n  if [ \"$i\" -ge \"$MAX_RETRIES\" ]; then\n    echo \"ERROR: Timed out\
          \ waiting for ${WAIT_HOST}:${WAIT_PORT} after ${MAX_RETRIES} attempts.\"\n    exit 1\n  fi\n\
          \  echo \"Waiting for ${WAIT_HOST}:${WAIT_PORT} (attempt ${i}/${MAX_RETRIES})...\"\n  sleep\
          \ 5\ndone\n"
        command:
        - /bin/sh
        - -ec
        env:
        - name: WAIT_HOST
          value: ml-pipeline
        - name: WAIT_PORT
          value: '8888'
        image: docker.io/alpine:3.23
        name: wait-for-ml-pipeline
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: ml-pipeline-scheduledworkflow
      volumes:
      - name: scheduledworkflow-sa-token
        projected:
          sources:
          - serviceAccountToken:
              audience: pipelines.kubeflow.org
              expirationSeconds: 3600
              path: scheduledworkflow-sa-token
