\"\n            metadataType: MetadataStringValue\n          hardware_type:\n            string_value: \"A100-40\"\n            metadataType: MetadataStringValue\n          hardware_count:\n            int_value: \"1\"\n            metadataType: MetadataIntValue\n\n  - name: openai-compatible/function-caller-7b\n    provider: Function AI Labs\n    logo: data:image/svg+xml;base64,\n    description: |-\n      (DEMO) Function-Caller-7B is a specialized language model optimized for tool calling and\n      function execution with structured JSON output and parameter validation.\n    readme: |-\n      # Function-Caller-7B\n\n      **Model Summary:**\n      Function-Caller-7B is an instruction-tuned model specifically designed for function calling,\n      tool use, and API integration scenarios.\n\n      - **Developers:** Function AI Labs\n      - **Release Date**: February 1st, 2025\n      - **License:** [MIT License](https://opensource.org/licenses/MIT)\n\n      **Capabilities:**\n      * Accurate function parameter extraction\n      * Multi-turn function calling\n      * JSON schema validation\n      * Parallel function execution\n      * Error handling and retry logic\n\n      **Use Cases:**\n      - Agent frameworks and autonomous systems\n      - API orchestration\n      - Database query generation\n      - Workflow automation\n      - Tool-augmented LLM applications\n\n      **Compatible With:**\n      - OpenAI function calling API\n      - LangChain tools\n      - Custom function schemas\n    language: [\"\
    en\"]\n    license: mit\n    licenseLink: https://opensource.org/licenses/MIT\n    libraryName: transformers\n    tasks:\n      - tool-calling\n      - text-generation\n    validatedTasks:\n      - tool-calling\n      - text-generation\n    servingConfig:\n      toolCalling:\n        toolCallParser: granite\n        chatTemplate: opt/app-root/template/tool_chat_template_granite.jinja\n        enableAutoToolChoice: true\n        requiredArgs:\n          - \"--config_format granite\"\n    createTimeSinceEpoch: \"1738368000000\"\n    lastUpdateTimeSinceEpoch: \"1738368000000\"\n    customProperties:\n      model_type:\n        string_value: \"agent\"\n        metadataType: MetadataStringValue\n      max_tools:\n        string_value: \"32\"\n        metadataType: MetadataStringValue\n    artifacts:\n      - uri: oci://registry.example.com/function-ai/function-caller-7b:v1.2\n        createTimeSinceEpoch: \"1738368000000\"\n        lastUpdateTimeSinceEpoch: \"1738368000000\"\n        customProperties:\n          architecture:\n            metadataType: MetadataStringValue\n            string_value: '[\"amd64\"]'\n  "
  sources.yaml: |
    model_catalogs:
      - name: "Organization AI Models"
        id: organization_ai_models
        type: yaml
        enabled: true
        properties:
          yamlCatalogPath: dev-organization-models.yaml
        labels:
          - Organization AI
      - name: "Validated AI Models"
        id: validated_ai_models
        type: yaml
        enabled: true
        properties:
          yamlCatalogPath: dev-validated-models.yaml
        labels:
          - Validated AI
      - name: "Community and Custom Models"
        id: community_custom_models
        type: yaml
        enabled: true
        properties:
          yamlCatalogPath: dev-community-models.yaml

    mcp_catalogs:
      - name: "Organization MCP Servers"
        id: organization_mcp_servers
        type: yaml
        enabled: true
        properties:
          yamlCatalogPath: dev-organization-mcp-servers.yaml
        labels:
          - Organization MCP
      - name: "Community and Custom MCP Servers"
        id: community_mcp_servers
        type: yaml
        enabled: true
        properties:
          yamlCatalogPath: dev-community-mcp-servers.yaml

    agent_catalogs:
      - name: "Sample Agents"
        id: sample_agents
        type: yaml
        enabled: true
        properties:
          yamlCatalogPath: dev-sample-agents.yaml
      - name: "Enterprise Agents"
        id: enterprise_agents
        type: yaml
        enabled: true
        properties:
          yamlCatalogPath: dev-enterprise-agents.yaml
        labels:
          - Enterprise

    # skill_catalogs are git-backed (type: git-skills-plugin): the listed repositories
    # are resolved at sync time by a temporary, discarded clone — no skill content is
    # vendored into this repo. refs must be immutable (tags/SHAs); branches and HEAD
    # are refused by the resolver.
    skill_catalogs:
      - name: "Matt Pocock's Skills"
        id: mattpocock_skills
        type: git-skills-plugin
        enabled: true
        properties:
          repositories:
            - url: https://github.com/mattpocock/skills
              refs: [v1.2.3]
              trustTier: communityContributed
              provider: Matt Pocock
        labels:
          - Community

    # namedQueries define reusable server-side filter presets that clients can
    # reference by name via the `namedQuery` API parameter. Multiple config files
    # can contribute queries; later files override individual fields within a query
    # of the same name.
    namedQueries:
      # read_only_servers: servers whose tools only perform read operations.
      # Useful for environments where write-capable tools require additional approval.
      read_only_servers:
        assetType: mcp_servers
        filters:
          readOnlyTools:
            operator: "="
            value: true

      # fully_audited: servers that have a verified source, a secure endpoint,
      # and have passed static analysis security testing (SAST). These are the
      # highest-trust servers in the catalog.
      fully_audited:
        assetType: mcp_servers
        filters:
          verifiedSource:
            operator: "="
            value: true
          secureEndpoint:
            operator: "="
            value: true
          sast:
            operator: "="
            value: true

      # remote_servers: servers hosted externally and accessed via a network
      # endpoint rather than deployed locally.
      remote_servers:
        assetType: mcp_servers
        filters:
          deploymentMode:
            operator: "="
            value: "remote"
kind: ConfigMap
metadata:
  name: model-catalog-sources
  namespace: kubeflow
---
apiVersion: v1
data:
  sources.yaml: |
    skill_catalogs: []
kind: ConfigMap
metadata:
  name: skill-catalog-sources
  namespace: kubeflow
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: model-catalog
    app.kubernetes.io/part-of: model-catalog
  name: model-catalog
  namespace: kubeflow
spec:
  ports:
  - appProtocol: http
    name: http-api
    port: 8080
    protocol: TCP
  selector:
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: model-catalog
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/name: model-catalog
    app.kubernetes.io/part-of: model-catalog
  name: model-catalog-postgres
  namespace: kubeflow
spec:
  ports:
  - name: postgres
    port: 5432
    protocol: TCP
  selector:
    app.kubernetes.io/component: database
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: model-catalog
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: model-catalog
    app.kubernetes.io/part-of: model-catalog
  name: model-catalog-server
  namespace: kubeflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/name: model-catalog
      app.kubernetes.io/part-of: model-catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/name: model-catalog
        app.kubernetes.io/part-of: model-catalog
        sidecar.istio.io/inject: 'true'
    spec:
      containers:
      - args:
        - --performance-metrics=/perf-data
        - --listen=0.0.0.0:8080
        - --catalogs-path=/catalog/sources.yaml
        - --catalogs-path=/mcp-catalog/sources.yaml
        - --catalogs-path=/skill-catalog/sources.yaml
        command:
        - /model-registry
        - catalog
        env:
        - name: PGHOST
          value: model-catalog-postgres
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              key: POSTGRES_USER
              name: model-catalog-postgres
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: model-catalog-postgres
        - name: HF_API_KEY
          valueFrom:
            secretKeyRef:
              key: HF_API_KEY
              name: model-catalog-hf-api-key
              optional: true
        image: ghcr.io/kubeflow/hub/server:v0.3.17
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 5
          tcpSocket:
            port: http-api
          timeoutSeconds: 2
        name: catalog
        ports:
        - containerPort: 8080
          name: http-api
        readinessProbe:
          initialDelaySeconds: 3
          periodSeconds: 5
          tcpSocket:
            port: http-api
          timeoutSeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /perf-data
          name: perf-data
        - mountPath: /catalog
          name: sources
        - mountPath: /mcp-catalog
          name: mcp-sources
        - mountPath: /skill-catalog
          name: skill-sources
        - mountPath: /etc/skill-catalog/git-credentials
          name: skill-git-credentials
          readOnly: true
      initContainers:
      - command:
        - /bin/sh
        - -c
        - tar zxf /demo-perf-data/dev-validated-perf-data.tar.gz -C /shared
        image: busybox
        name: perf-data-init
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 65534
        volumeMounts:
        - mountPath: /shared
          name: perf-data
        - mountPath: /demo-perf-data
          name: demo-perf-data
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          name: model-catalog-demo-perf-data
        name: demo-perf-data
      - emptyDir: {}
        name: perf-data
      - configMap:
          name: model-catalog-sources
        name: sources
      - configMap:
          name: mcp-catalog-sources
        name: mcp-sources
      - configMap:
          name: skill-catalog-sources
        name: skill-sources
      - name: skill-git-credentials
        secret:
          optional: true
          secretName: skill-catalog-git-credentials
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    component: model-catalog-server
  name: model-catalog-postgres
  namespace: kubeflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: model-catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/component: database
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: model-catalog
        sidecar.istio.io/inject: 'false'
      name: postgres
    spec:
      containers:
      - env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        envFrom:
        - secretRef:
            name: model-catalog-postgres
        image: postgres:17.6
        name: postgres
        ports:
        - containerPort: 5432
          name: postgres
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 70
          runAsUser: 70
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: model-catalog-postgres
      securityContext:
        fsGroup: 70
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir: {}
        name: model-catalog-postgres
