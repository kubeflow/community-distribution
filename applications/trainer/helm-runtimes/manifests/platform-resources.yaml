                  name: node
                  readinessProbe:
                    initialDelaySeconds: 5
                    tcpSocket:
                      port: 2222
                  securityContext:
                    runAsUser: 1000
                securityContext:
                  fsGroup: 1000
      - dependsOn:
        - name: node
          status: Ready
        name: launcher
        template:
          metadata:
            labels:
              trainer.kubeflow.org/trainjob-ancestor-step: trainer
          spec:
            template:
              spec:
                containers:
                - image: ghcr.io/kubeflow/trainer/deepspeed-runtime:v2.3.0
                  name: node
                  securityContext:
                    runAsUser: 1000
                securityContext:
                  fsGroup: 1000
      successPolicy:
        operator: All
        targetReplicatedJobs:
        - launcher
